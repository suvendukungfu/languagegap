name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  security-and-data-audit:
    name: Security & Dataset Provenance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.7.0

      - name: Run Secret Scanning Audit
        run: python3 scripts/check_secrets.py

      - name: Validate Benchmark Dataset Schema & Provenance
        run: python3 backend/app/benchmark/validator.py backend/data/benchmarks/v1/digital_literacy.json

  backend-test-suite:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: [security-and-data-audit]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: cd backend && pytest -v

  frontend-ci:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    needs: [security-and-data-audit]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Frontend ESLint
        run: cd frontend && npm run lint

      - name: Frontend TypeScript Typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Frontend Unit Tests (Vitest)
        run: cd frontend && npm test

      - name: Frontend Production Build
        run: cd frontend && npm run build
